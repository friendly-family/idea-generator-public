name: Idea Generator Pipeline

on:
  workflow_dispatch:
    inputs:
      entry_point:
        description: "Точка входа: brainstorm (по умолчанию), seed, signal (скан новостей/сигналов, topic/domain необязательны)"
        required: false
        type: choice
        options: [brainstorm, seed, signal]
        default: brainstorm
      topic:
        description: "Тема идеи (обязательна, кроме entry_point=signal)"
        required: false
        type: string
        default: ""
      domain:
        description: "Домен / индустрия (обязателен, кроме entry_point=signal)"
        required: false
        type: string
        default: ""
      constraints:
        description: "Ограничения (бюджет, юрисдикция, сроки)"
        required: false
        type: string
        default: ""
      seed_idea:
        description: "Pre-made idea (skips BRAINSTORMER) — plain text or JSON {id,title,description,tags}"
        required: false
        type: string
        default: ""
      continue_run_id:
        description: "RUN_ID для продолжения после HITL"
        required: false
        type: string
        default: ""
      hitl_decision:
        description: "Решение HITL: confirm / dispute"
        required: false
        type: string
        default: ""
      hitl_id:
        description: "ID HITL-этапа для продолжения (hitl-1, hitl-2, hitl-3)"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # No explicit timeout previously -- defaulted to GitHub's 6-hour cap,
    # so a hung run (observed live 2026-10-01, cancelled manually after
    # 40+ minutes) could silently burn CI minutes for hours. Longest real
    # run observed: ~31 min pre-parallelization, ~9 min post (decision
    # 0015); 60 is a generous margin above either.
    timeout-minutes: 60
    env:
      KILO_GATEWAY_URL: ${{ secrets.KILO_GATEWAY_URL }}
      KILO_API_KEY: ${{ secrets.KILO_API_KEY }}
      IDEA_GENERATOR_MODEL: ${{ secrets.IDEA_GENERATOR_MODEL || 'stepfun/step-3.7-flash:free' }}
      GITHUB_MODEL: ${{ secrets.IDEA_GENERATOR_MODEL || 'stepfun/step-3.7-flash:free' }}
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      SEARCH_PROVIDERS: ${{ secrets.SEARCH_PROVIDERS }}
      TOPIC: ${{ inputs.topic }}
      DOMAIN: ${{ inputs.domain }}
      CONSTRAINTS: ${{ inputs.constraints }}
      SEED_IDEA: ${{ inputs.seed_idea }}
      ENTRY_POINT: ${{ inputs.entry_point }}
      CONTINUE_RUN_ID: ${{ inputs.continue_run_id || '' }}
      RUN_ID: ${{ inputs.continue_run_id || format('{0}-{1}', github.run_id, github.run_attempt) }}
      HITL_DECISION: ${{ inputs.hitl_decision || '' }}
      HITL_ID: ${{ inputs.hitl_id || '' }}
      HITL1_TIMEOUT_SECONDS: ${{ vars.HITL1_TIMEOUT_SECONDS || '3600' }}
      HITL2_TIMEOUT_SECONDS: ${{ vars.HITL2_TIMEOUT_SECONDS || '3600' }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      PRIVATE_REPOSITORY: friendly-family/idea-generator-private

    steps:
      - name: Checkout public repo
        uses: actions/checkout@v4

      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          repository: friendly-family/idea-generator-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml python-dotenv qdrant-client jsonschema

      - name: Run pipeline
        id: pipeline
        run: python private/orchestrator/runner.py
        env:
          STEP_NAME: full

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: idea-generator-${{ env.RUN_ID }}
          path: private/artifacts/${{ env.RUN_ID }}/
          retention-days: 30
          if-no-files-found: warn
